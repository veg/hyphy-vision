# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 17.x: Node that serves vision.hyphy.org (pm2, v17.9.1).
        # 18.x: previous CI baseline.
        # 23.x: Node that builds vision.hyphy.org (v23.3.0). EOL, kept only
        #       while the build host uses it; see DEPLOY.md.
        # 24.x: current LTS; flags breakage before the build host leaves 23.x.
        node-version: [17.x, 18.x, 23.x, 24.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install
      - run: yarn build
      - name: Smoke-test server.js
        run: |
          test -s dist/index.html
          test -s dist/hyphyvision.js
          PORT=8000 node server.js &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null 'http://localhost:8000/fel?json=https://example.org/results.FEL.json'
      - run: yarn test
        env:
          CI: true
